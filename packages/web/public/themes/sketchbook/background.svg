<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice">
  <!--
    Sketchbook - the "skin-05" direction: warm cream notebook paper with subtle fibres, lively
    hand-drawn doodles, curved marker strokes, confetti, stars, lightning bolts, paint swashes
    and paper-tape fragments in turquoise, teal, sunflower yellow, coral and sky blue.

    The direction puts an anime character on the right; this renders the page instead.
    Composition follows the same contract: x=0%-52% (up to 1330) stays open and low-density -
    a cream wash with only a few thin teal arcs and tiny distant confetti.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0.45">
      <stop offset="0" stop-color="#fdfaf0" />
      <stop offset="0.5" stop-color="#fbf5e6" />
      <stop offset="1" stop-color="#f7eed7" />
    </linearGradient>
    <radialGradient id="daylight" cx="0.2" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur30" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <!-- A marker stroke: a thick tapered arc, as if drawn with a broad nib. -->
    <path id="stroke" d="M0 0 C 90 -70, 220 -90, 330 -40 C 400 -8, 470 20, 540 10 L 536 54 C 460 66, 388 36, 316 4 C 214 -42, 96 -22, 14 44 Z" />
  </defs>

  <rect width="2560" height="1440" fill="url(#paper)" />
  <rect width="2560" height="1440" fill="url(#daylight)" />

  <!-- Paper fibre. -->
  <g stroke="#e3d8ba" stroke-width="1.4" opacity="0.3">
    <line x1="0" y1="240" x2="2560" y2="228" />
    <line x1="0" y1="560" x2="2560" y2="576" />
    <line x1="0" y1="880" x2="2560" y2="866" />
    <line x1="0" y1="1200" x2="2560" y2="1214" />
  </g>

  <!-- Broad paint swashes, behind everything, right of centre. -->
  <g filter="url(#blur30)" opacity="0.4">
    <ellipse cx="1980" cy="520" rx="380" ry="180" fill="#8fd4d8" />
    <ellipse cx="2220" cy="980" rx="340" ry="200" fill="#f6d36a" />
    <ellipse cx="1660" cy="1180" rx="300" ry="150" fill="#f4a08c" />
  </g>

  <!-- Thin teal arcs reaching into the safe zone: the direction allows a few. -->
  <g fill="none" stroke="#3fa8ad" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M900 380 C 1120 300, 1300 340, 1440 440" />
    <path d="M960 1060 C 1160 1000, 1320 1030, 1440 1100" />
  </g>

  <!-- Marker strokes. -->
  <g opacity="0.85">
    <use href="#stroke" transform="translate(1400 260) scale(1.5)" fill="#3fa8ad" opacity="0.75" />
    <use href="#stroke" transform="translate(1560 700) scale(1.2) rotate(16)" fill="#f2b134" opacity="0.7" />
    <use href="#stroke" transform="translate(1680 1080) scale(1.35) rotate(-12)" fill="#ef7f66" opacity="0.68" />
    <use href="#stroke" transform="translate(1980 420) scale(1.05) rotate(8)" fill="#5ec2c9" opacity="0.6" />
  </g>

  <!-- Free-form squiggles. -->
  <g fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M1520 200 q 60 -50 110 0 t 110 0 t 110 0" stroke="#2f8f95" stroke-width="6" />
    <path d="M1880 860 q 54 -44 100 0 t 100 0" stroke="#ef7f66" stroke-width="6" />
    <path d="M2160 1240 q 48 -40 90 0 t 90 0" stroke="#f2b134" stroke-width="6" />
    <path d="M1700 520 q 44 -36 84 0 t 84 0" stroke="#3fa8ad" stroke-width="5" opacity="0.7" />
  </g>

  <!-- Lightning bolts. -->
  <g fill="#f2b134" stroke="#d99a20" stroke-width="3" stroke-linejoin="round">
    <path d="M2140 200 l -70 130 h 56 l -44 120 l 118 -150 h -58 l 52 -100 z" />
    <path d="M2480 900 l -46 88 h 38 l -30 80 l 80 -100 h -40 l 36 -68 z" opacity="0.9" />
  </g>

  <!-- Confetti: small rotated rectangles and circles, densest at the far right. -->
  <g>
    <rect x="1620" y="440" width="22" height="10" rx="3" fill="#ef7f66" transform="rotate(24 1631 445)" />
    <rect x="1800" y="620" width="20" height="9" rx="3" fill="#3fa8ad" transform="rotate(-32 1810 624)" />
    <rect x="2020" y="740" width="24" height="10" rx="3" fill="#f2b134" transform="rotate(48 2032 745)" />
    <rect x="2260" y="560" width="20" height="9" rx="3" fill="#8fd4d8" transform="rotate(-18 2270 564)" />
    <rect x="2400" y="1080" width="22" height="10" rx="3" fill="#ef7f66" transform="rotate(36 2411 1085)" />
    <rect x="1740" y="900" width="18" height="8" rx="3" fill="#2f8f95" transform="rotate(-44 1749 904)" />
    <rect x="2180" y="1000" width="20" height="9" rx="3" fill="#f2b134" transform="rotate(14 2190 1004)" />
    <rect x="1480" y="760" width="16" height="7" rx="3" fill="#8fd4d8" transform="rotate(62 1488 763)" />
    <rect x="2520" y="640" width="18" height="8" rx="3" fill="#3fa8ad" transform="rotate(-26 2529 644)" />
  </g>
  <g>
    <circle cx="1900" cy="260" r="7" fill="#ef7f66" />
    <circle cx="2320" cy="380" r="6" fill="#f2b134" />
    <circle cx="1680" cy="640" r="6" fill="#3fa8ad" />
    <circle cx="2080" cy="1120" r="7" fill="#8fd4d8" />
    <circle cx="2460" cy="240" r="5" fill="#ef7f66" />
    <circle cx="1560" cy="960" r="5" fill="#f2b134" />
  </g>

  <!-- Five-point stars. -->
  <g fill="#f2b134" opacity="0.9">
    <path d="M2000 180 l 9 26 h 28 l -22 17 l 8 27 l -23 -17 l -23 17 l 8 -27 l -22 -17 h 28 z" />
    <path d="M1760 1160 l 7 21 h 22 l -18 14 l 7 21 l -18 -14 l -18 14 l 7 -21 l -18 -14 h 22 z" />
    <path d="M2440 460 l 6 18 h 19 l -15 12 l 6 18 l -16 -12 l -16 12 l 6 -18 l -15 -12 h 19 z" />
  </g>

  <!-- Small hearts. -->
  <g fill="#ef7f66" opacity="0.85">
    <path d="M1880 1080 c 0 -10, 14 -12, 16 0 c 2 -12, 16 -10, 16 0 c 0 12, -16 20, -16 20 s -16 -8, -16 -20 z" />
    <path d="M2300 820 c 0 -8, 11 -10, 13 0 c 2 -10, 13 -8, 13 0 c 0 10, -13 16, -13 16 s -13 -6, -13 -16 z" />
    <path d="M1620 1220 c 0 -8, 11 -10, 13 0 c 2 -10, 13 -8, 13 0 c 0 10, -13 16, -13 16 s -13 -6, -13 -16 z" />
  </g>

  <!-- Paper-tape fragments: translucent, rotated, with torn ends. -->
  <g opacity="0.75">
    <g transform="rotate(-16 2100 320)">
      <rect x="2010" y="290" width="180" height="46" fill="#f6e2a8" />
      <path d="M2010 290 l -16 12 l 16 10 l -16 12 l 16 12 h 180 v -46 z" fill="#f6e2a8" />
    </g>
    <g transform="rotate(22 2340 1160)">
      <rect x="2260" y="1130" width="160" height="42" fill="#bfe6e8" />
      <path d="M2260 1130 l -14 11 l 14 9 l -14 11 l 14 11 h 160 v -42 z" fill="#bfe6e8" />
    </g>
  </g>

  <!-- Tiny distant confetti inside the safe zone: the direction allows a few marks. -->
  <g opacity="0.3">
    <circle cx="1180" cy="520" r="4" fill="#3fa8ad" />
    <circle cx="1260" cy="880" r="3.5" fill="#f2b134" />
    <circle cx="1080" cy="1160" r="3.5" fill="#ef7f66" />
  </g>
</svg>
