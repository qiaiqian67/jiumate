<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice">
  <!--
    Rose Garden - the "skin-01" direction from Codex Dream Skin's
    docs/background-generation-prompts.md: high-key diffused studio light, warm ivory and
    sakura pink, roses, petals, pearlescent dust.

    Authored here as SVG rather than generated: the directions call for a figure on the right,
    and this renders the environment only, which keeps it clear of the likeness question that
    document is emphatic about.

    Composition follows the same contract the directions state - x=0%-52% (up to 1330) is a
    calm, low-contrast text-safe zone; the interest concentrates from xH1400 rightward.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fefaf7" />
      <stop offset="0.45" stop-color="#fdf1ef" />
      <stop offset="0.72" stop-color="#f8e2e6" />
      <stop offset="1" stop-color="#f2d3dc" />
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warm" cx="0.86" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#f6c9d4" stop-opacity="0.5" />
      <stop offset="1" stop-color="#f6c9d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="petal" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff2f4" />
      <stop offset="1" stop-color="#e9a7b6" />
    </radialGradient>
    <radialGradient id="petalDeep" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f7c6d0" />
      <stop offset="1" stop-color="#cf8496" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <g id="rose">
      <circle r="52" fill="url(#petal)" />
      <circle r="34" fill="#fbe0e6" opacity="0.9" />
      <circle r="18" fill="#f3c3ce" opacity="0.85" />
      <circle r="7" fill="#e7a3b3" opacity="0.7" />
    </g>
  </defs>

  <rect width="2560" height="1440" fill="url(#base)" />
  <rect width="2560" height="1440" fill="url(#glow)" />
  <rect width="2560" height="1440" fill="url(#warm)" />

  <!-- Curtain folds: wide, soft, almost flat - they must not put contrast behind text. -->
  <g filter="url(#haze)" opacity="0.5">
    <path d="M1180 -80 C 1240 400, 1160 900, 1240 1520 L 1420 1520 C 1340 900, 1420 400, 1360 -80 Z" fill="#f7dbe2" />
    <path d="M1760 -80 C 1830 380, 1740 940, 1830 1520 L 2020 1520 C 1930 940, 2020 380, 1950 -80 Z" fill="#f4d2dc" />
    <path d="M2300 -80 C 2370 420, 2290 960, 2380 1520 L 2560 1520 L 2560 -80 Z" fill="#f0c8d4" />
  </g>

  <!-- Rose bank: dense at the right edge and lower-right, thinning inward. -->
  <g filter="url(#soft)">
    <g opacity="0.9">
      <use href="#rose" transform="translate(2140 1180) scale(1.25)" />
      <use href="#rose" transform="translate(2330 1010) scale(1.05)" />
      <use href="#rose" transform="translate(2440 1240) scale(1.4)" />
      <use href="#rose" transform="translate(1990 1330) scale(0.95)" />
      <use href="#rose" transform="translate(2500 860) scale(0.85)" />
    </g>
    <g opacity="0.55">
      <use href="#rose" transform="translate(1870 1120) scale(0.7)" />
      <use href="#rose" transform="translate(2260 780) scale(0.62)" />
      <use href="#rose" transform="translate(2060 960) scale(0.55)" />
    </g>
  </g>

  <!-- A few deeper blooms for depth, kept right of x=1400. -->
  <g opacity="0.75">
    <circle cx="2380" cy="1150" r="46" fill="url(#petalDeep)" />
    <circle cx="2200" cy="1290" r="34" fill="url(#petalDeep)" />
    <circle cx="2470" cy="1000" r="30" fill="url(#petalDeep)" />
  </g>

  <!-- Translucent leaves: the faintest suggestion, only near the outer edge. -->
  <g fill="#e9b9a8" opacity="0.28">
    <ellipse cx="1520" cy="180" rx="90" ry="26" transform="rotate(-24 1520 180)" />
    <ellipse cx="1660" cy="300" rx="70" ry="20" transform="rotate(-8 1660 300)" />
    <ellipse cx="1780" cy="1320" rx="80" ry="22" transform="rotate(14 1780 1320)" />
  </g>

  <!-- Falling petals. Sparse on the left, and none inside the busiest text band. -->
  <g fill="#f6ccd6" opacity="0.75">
    <ellipse cx="1460" cy="240" rx="16" ry="9" transform="rotate(28 1460 240)" />
    <ellipse cx="1620" cy="470" rx="13" ry="7" transform="rotate(-16 1620 470)" />
    <ellipse cx="1780" cy="700" rx="18" ry="10" transform="rotate(42 1780 700)" />
    <ellipse cx="1560" cy="900" rx="12" ry="7" transform="rotate(-32 1560 900)" />
    <ellipse cx="1960" cy="380" rx="15" ry="8" transform="rotate(10 1960 380)" />
    <ellipse cx="2080" cy="600" rx="11" ry="6" transform="rotate(56 2080 600)" />
    <ellipse cx="1840" cy="1080" rx="14" ry="8" transform="rotate(-24 1840 1080)" />
    <ellipse cx="2300" cy="520" rx="12" ry="7" transform="rotate(18 2300 520)" />
    <ellipse cx="1420" cy="1180" rx="10" ry="6" transform="rotate(-40 1420 1180)" />
    <ellipse cx="2520" cy="700" rx="13" ry="7" transform="rotate(30 2520 700)" />
  </g>

  <!-- Pearlescent dust and warm glints. -->
  <g fill="#ffffff">
    <circle cx="1510" cy="330" r="3" opacity="0.9" />
    <circle cx="1700" cy="220" r="2" opacity="0.8" />
    <circle cx="1900" cy="560" r="2.5" opacity="0.85" />
    <circle cx="2130" cy="430" r="2" opacity="0.7" />
    <circle cx="2360" cy="660" r="3" opacity="0.9" />
    <circle cx="1660" cy="820" r="2" opacity="0.7" />
    <circle cx="2010" cy="1240" r="2.5" opacity="0.8" />
    <circle cx="2450" cy="380" r="2" opacity="0.75" />
  </g>
  <g fill="#f0c07a" opacity="0.5">
    <circle cx="1580" cy="600" r="2" />
    <circle cx="1880" cy="900" r="1.8" />
    <circle cx="2240" cy="900" r="2.2" />
    <circle cx="2500" cy="1180" r="1.8" />
  </g>

  <!-- Creamy bokeh, low opacity so it reads as depth rather than as specks. -->
  <g fill="#ffffff" opacity="0.28">
    <circle cx="1620" cy="1080" r="54" />
    <circle cx="1980" cy="700" r="70" />
    <circle cx="2400" cy="900" r="46" />
    <circle cx="2160" cy="260" r="38" />
  </g>
</svg>
